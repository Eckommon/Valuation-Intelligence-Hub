name: CI / 지속적 통합

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  test:
    name: Python tests / Python 테스트
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - name: Checkout / 저장소 체크아웃
        uses: actions/checkout@v4

      - name: Set up Python / Python 설정
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install package and test dependencies / 패키지·테스트 의존성 설치
        run: python -m pip install --upgrade pip && python -m pip install -e ".[dev]"

      - name: Run tests / 테스트 실행
        run: python -m pytest
