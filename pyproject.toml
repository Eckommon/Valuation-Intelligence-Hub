[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "valuation-intelligence-hub"
version = "0.1.0"
description = "Reproducible, evidence-grounded valuation intelligence system / 재현 가능하고 근거 중심의 가치분석 인텔리전스 시스템"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
vih = "valuation_hub.cli:main"

[project.optional-dependencies]
web = [
  "fastapi>=0.141,<0.142",
  "uvicorn>=0.52,<0.53",
  "jinja2>=3.1,<4",
]
dev = [
  "pytest>=8.0",
  "fastapi>=0.141,<0.142",
  "uvicorn>=0.52,<0.53",
  "jinja2>=3.1,<4",
  "httpx>=0.28,<1",
]

[tool.setuptools.package-data]
valuation_hub = ["templates/*.html", "static/*.css"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-q"
